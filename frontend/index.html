<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme and main color before first paint so nothing flashes.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var a = localStorage.getItem("theme-css") || localStorage.getItem("accent-css");
        if (a) document.documentElement.style.cssText = a;
      } catch (e) {}
    </script>
    <title>Askbase</title>
    <meta name="description" content="Ask questions about your database in plain language." />
    <meta name="theme-color" content="#0066d6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
