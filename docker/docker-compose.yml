# Qdrant for the few-shot examples. Run from the project root:
#   docker compose -f docker/docker-compose.yml up -d
name: chat-with-database

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
